; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini
; native is test-only (`pio test -e native`); keep it out of a bare `pio run`.
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Connect secrets
;extra_configs = secrets.ini
build_flags =
    ${secrets.build_flags}
    -D VERSION=\"1.1.1\"
    -I src

; Monitor settings
monitor_speed = 115200
upload_port = /dev/cu.usbserial-A5069RR4
upload_speed = 921600

; File system settings
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

; Libs autoload
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    arduino-libraries/NTPClient @ ^3.2.1
    adafruit/Adafruit BMP280 Library @ ^2.6.6
    adafruit/Adafruit Unified Sensor @ ^1.1.9

; On-device unit tests (`pio test -e nodemcuv2`) for schedule_logic.h (real
; Arduino String, real board). src/main.cpp already owns setup()/loop(), and
; so does the Unity test runner, so src/ must be excluded from the test
; build - the test only needs the header, included directly via -I src above.
test_build_src = no
; Only test_schedule_logic targets this env (test_connectivity_state is
; native-only - see [env:native] below - and has its own main(), which would
; fail to link here since it doesn't provide setup()/loop()).
test_filter = test_schedule_logic

; Host-side unit tests for the connectivity state machine (src/connectivity_state.h).
; No Arduino/ESP8266 framework here on purpose - that header has none as a dependency
; either, so it can be exercised with plain Unity on the dev machine, no hardware needed.
[env:native]
platform = native
build_flags = -std=gnu++17 -I src
test_framework = unity
; This env only exists for `pio test -e native`; src/main.cpp is an Arduino
; sketch and must not be built as a plain program for a `pio run`/`pio run`
; (no -e) pass over every environment.
build_src_filter = -<*>
; Only test_connectivity_state targets this env - test_schedule_logic needs
; the real Arduino String, which framework-less native doesn't have.
test_filter = test_connectivity_state

