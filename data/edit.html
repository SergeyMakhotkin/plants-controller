<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Редактировать расписание</title>
    <link rel="stylesheet" href="/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="form-container">
    <h2>📝 Редактировать интервал</h2>
    <form action="/save" method="POST">
        <input type="hidden" name="rid" value="%RID%">
        <input type="hidden" name="id" value="%ID%">

        <div class="form-group">
            <strong>Время начала (Cron):</strong>
            <input type="text" name="start" value="%START%" required>
        </div>

        <div class="form-group">
            <strong>Тип завершения:</strong>
            <p>Заполните только одно поле:</p>
            <strong>Конец (Cron):</strong>
            <input type="text" name="end" value="%END%">
            <strong>ИЛИ Длительность (сек):</strong>
            <input type="number" name="duration" value="%DURATION%">
        </div>

        <input type="submit" value="Сохранить изменения">
        <br><br>
        <a href="/" style="display:block; text-align:center;">Отмена</a>
    </form>
</div>
</body>
</html>
